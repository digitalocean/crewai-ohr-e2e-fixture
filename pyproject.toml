[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-ohr-e2e-fixture"
version = "0.3.0"
description = "Real CrewAI Crew (2 sequential agents) fixture for OHR kickoff E2E"
requires-python = ">=3.11,<3.14"
dependencies = [
  # Guest image pins crewai; leave a floor so local installs stay usable.
  "crewai>=1.14.7",
  # Action Gateway integration scenario: wraps the do.actions MCP server
  # as CrewAI tools (crew.py). Not preinstalled in the guest image, so a
  # customer wiring their own AG tool in would add this too.
  "crewai-tools[mcp]>=0.60.0",
]

[tool.setuptools.packages.find]
include = ["e2e_crew*", "e2e_flow*"]

[tool.crewai]
crew = "e2e_crew.crew:crew"
