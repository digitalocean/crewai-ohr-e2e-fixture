[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-ohr-e2e-fixture"
version = "0.1.0"
description = "No-LLM conversational Flow fixture for OHR crewai L1 E2E"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["e2e_flow*"]

[tool.crewai]
flow = "e2e_flow.flow:E2EFlow"
